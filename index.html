<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>youtube-audio demo</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:560px;margin:10vh auto;padding:0 1rem;text-align:center;color:#111;background:#fafafa}
    form{display:flex;gap:.5rem;margin:1.5rem 0}
    input{flex:1;padding:.6rem;border:1px solid #bbb;border-radius:8px;font-size:1rem}
    button.load{padding:.6rem 1rem;border:0;border-radius:8px;background:#111;color:#fff;font-size:1rem;cursor:pointer}
    youtube-audio{--ya-size:84px}
    p.hint{color:#666;font-size:.9rem}
    @media (prefers-color-scheme:dark){body{background:#111;color:#eee}input{background:#222;color:#eee;border-color:#444}button.load{background:#eee;color:#111}p.hint{color:#999}}
  </style>
</head>
<body>
  <h1>youtube-audio</h1>
  <p class="hint">Paste a YouTube link, load it, then press the button.</p>
  <form id="f">
    <input id="url" type="text" placeholder="https://www.youtube.com/watch?v=..." aria-label="YouTube link" required>
    <button class="load" type="submit">Load</button>
  </form>
  <youtube-audio id="player" loop resume label="Demo audio"></youtube-audio>

  <script src="youtube-audio.js"></script>
  <script>
    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('player').setAttribute('video', document.getElementById('url').value);
    });
  </script>
</body>
</html>
